<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#007AFF">
    <title>My Tasks</title>
    <link rel="stylesheet" href="style.css">
     

<link rel="apple-touch-icon" href="app-icon.png.PNG">

     <meta name="apple-mobile-web-app-title" content="To Do">
     <meta name="apple-mobile-web-app-capable" content="yes">
     <meta name="apple-mobile-web-app-status-bar-style" content="default">

     <link rel="manifest" href="manifest.json">  
     
</head>

<body>
    <!-- Intro Screen -->
<div id="introScreen">
    <div class="intro-content">
        <h1 id="introTitle">My Tasks.</h1>
        <p id="introCredit">by Osama Raaid</p>
    </div>
</div>

<main class="app">

  <header class="header">

    <div>
        <p class="welcome" id="welcome">
            Welcome 👋
        </p>

        <h1>My Tasks</h1>
    </div>

    <div class="header-actions">

        <button
            class="menu-btn"
            id="menuBtn"
            aria-label="Open menu">
            ☰
        </button>

    </div>

</header>


    <section class="add-task">

        <input
            id="taskInput"
            type="text"
            placeholder="What needs to be done?"
            autocomplete="off"
        >

        <button
            id="addBtn"
            class="add-btn">
            +
        </button>

    </section>


    <section class="groups">

        <button
            class="group-btn active"
            data-group="unassigned">
            Unassigned
        </button>

        <button
            class="group-btn"
            data-group="work">
            💼 Work
        </button>

        <button
            class="group-btn"
            data-group="study">
            📚 Study
        </button>

        <button
            class="group-btn"
            data-group="family">
            👨‍👩‍👧 Family
        </button>

        <button
            class="group-btn"
            data-group="personal">
            👤 Personal
        </button>

        <button class="create-group-btn" id="createGroupBtn">
        <span>＋</span>
        <span>Create Group</span>
        </button>

    </section>




    <section id="taskList"></section>


    <div id="emptyState" class="empty-state">

        <div class="empty-icon">
            ✓
        </div>

        <h2>No tasks yet</h2>

        <p>
            Add your first task.
        </p>

    </div>


    <footer>

        <span id="taskCount">
            0 tasks
        </span>

        <span class="copyright">
            By Osama Raaid
        </span>

    </footer>

</main>
<!-- APP DRAWER -->

<div class="drawer-overlay" id="drawerOverlay"></div>

<aside class="app-drawer" id="appDrawer">

    <div class="drawer-header">

        <div>
            <p class="drawer-small">My Tasks</p>
            <h2>Menu</h2>
        </div>

        <button
            class="drawer-close"
            id="drawerClose"
            aria-label="Close menu">
            ×
        </button>

    </div>


    <div class="drawer-content">

        <button
            class="drawer-item"
            id="profileBtn">

            <span class="drawer-icon">👤</span>

            <span class="drawer-text">
                Profile
            </span>

        </button>


        <button
            class="drawer-item"
            id="themesBtn">

            <span class="drawer-icon">🎨</span>

            <span class="drawer-text">
                Themes
            </span>

        </button>


        <button
            class="drawer-item"
            id="darkModeBtn">

            <span class="drawer-icon">🌙</span>

            <span
                class="drawer-text"
                id="darkModeText">
                Dark Mode
            </span>

        </button>


        <button
            class="drawer-item"
            id="sortBtn">

            <span class="drawer-icon">↕</span>

            <span class="drawer-text">
                Sort Tasks
            </span>

        </button>


        <button
            class="drawer-item"
            id="languageBtn">

            <span class="drawer-icon">🌐</span>

            <span class="drawer-text">
                Language
            </span>

        </button>


        <button
            class="drawer-item danger-item"
            id="trashBtn">

            <span class="drawer-icon">🗑️</span>

            <span class="drawer-text">
                Trash
            </span>

        </button>

    </div>


    <div class="drawer-footer">
        <span>To Do</span>
        <span>v2.0.0</span>
    </div>

</aside>



    
    <div class="group-modal" id="groupModal">
    <div class="group-modal-content">

        <button class="modal-close"  id="groupModalClose">×</button>

        <h2>Create Group</h2>

        <label for="groupName">Group name</label>
        <input
            type="text"
            id="groupName"
            placeholder="e.g. Gym"
            maxlength="30"
        >

        <label for="groupEmoji">Emoji</label>
        <input
            type="text"
            id="groupEmoji"
            placeholder="e.g. 🏋️"
            maxlength="2"
        >

        <button class="save-group-btn" id="saveGroupBtn">
            Create
        </button>

    </div>
</div>

   <div class="modal hidden" id="profileModal">

    <div class="modal-box">

        <button
            class="close"
            id="closeModal">
            ×
        </button>

       <h2 id="profileModalTitle">Your Profile</h2>

       <div id="profileFields">
    <label for="nameInput">Your name</label>

    <input
        id="nameInput"
        type="text"
        placeholder="Enter your name"
        maxlength="25"
    >
</div>
       <div id="themeFields"
        <h3>
            Theme Color
        </h3>

        <div class="colors">

            <button
                class="color"
                data-color="#007AFF"
                style="background:#007AFF">
            </button>

            <button
                class="color"
                data-color="#7C3AED"
                style="background:#7C3AED">
            </button>

            <button
                class="color"
                data-color="#16A34A"
                style="background:#16A34A">
            </button>

            <button
                class="color"
                data-color="#F97316"
                style="background:#F97316">
            </button>

            <button
                class="color"
                data-color="#EC4899"
                style="background:#EC4899">
            </button>

            <button
                class="color"
                data-color="#EF4444"
                style="background:#EF4444">
            </button>


            <button
                class="color"
                data-color="#44c7ef"
                style="background:#44c7ef">
            </button>

            <button
                class="color"
                data-color="#d7ec19"
                style="background:#d7ec19">
            </button>

             <button
                class="color"
                data-color="#f9047e"
                style="background:#f9047e">
            </button>

        </div>


    </div>


        <button
            class="save"
            id="saveProfile">
            Save
        </button>
    </div>

</div>


<script src="script.js"></script>

</body>
</html>
